services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.8.3
    container_name: bookhaedo-valhalla
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data/valhalla:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/asia/japan/hokkaido-latest.osm.pbf
      server_threads: ${VALHALLA_THREADS:-2}
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      build_transit: "False"
      build_tar: "True"
