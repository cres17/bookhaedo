<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1430" viewBox="0 0 1720 1430">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#929eb4" stroke-width="1.5"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;fill:#303650}.heading{font-size:24px;font-weight:600}.sub{font-size:19px;fill:#8a95aa}.title{font-size:25px;font-weight:600}.endpoint{font-size:20px;font-family:ui-monospace,monospace}.note{font-size:18px;fill:#7f8ba2}.arrow{stroke:#929eb4;stroke-width:2;fill:none;marker-end:url(#arrow)}.box{fill:#fff;stroke:#e0e6f0;stroke-width:1.5}.screen{fill:#edf1f8;stroke:#dce3ed}.warn{fill:#bf5a61}</style></defs>
<rect width="1720" height="1430" fill="#f7f9fc"/>
<text x="65" y="70" font-size="40" font-weight="700">Book해도. · REST API 연결도</text><text x="65" y="110" class="sub">Vue :5173 → /api 프록시 → Express :3001 → PostgreSQL :5433</text>
<text x="65" y="185" class="heading">사용자 화면 · Vue 3</text><text x="545" y="185" class="heading">요청 · REST / Google SDK</text><text x="1205" y="185" class="heading">데이터 · 응답</text>
<g transform="translate(0 220)"><rect class="screen" x="65" width="370" height="130" rx="18"/><text x="90" y="47" class="title">로그인 / 회원가입</text><text x="90" y="83" class="note">쿠키 세션으로 인증 유지</text><path class="arrow" d="M445 65H525"/><rect class="box" x="545" width="550" height="130" rx="18"/><text x="570" y="38" class="endpoint">POST /api/auth/register · login</text><text x="570" y="71" class="endpoint">GET /api/auth/me</text><text x="570" y="103" class="endpoint">POST /api/auth/logout</text><path class="arrow" d="M1105 65H1185"/><rect class="box" x="1205" width="450" height="130" rx="18"/><text x="1230" y="45" class="title">PostgreSQL · planner</text><text x="1230" y="82" class="endpoint">app_user / session</text><text x="1230" y="110" class="note">비밀번호 scrypt · HttpOnly 쿠키</text></g>
<g transform="translate(0 400)"><rect class="screen" x="65" width="370" height="130" rx="18"/><text x="90" y="47" class="title">지역 탐색 / 장소 상세</text><text x="90" y="83" class="note">검색 · 필터 · 페이지네이션</text><path class="arrow" d="M445 65H525"/><rect class="box" x="545" width="550" height="130" rx="18"/><text x="570" y="38" class="endpoint">GET /api/regions</text><text x="570" y="71" class="endpoint">GET /api/places?q=&amp;regionId=</text><text x="570" y="103" class="endpoint">GET /api/places/:id</text><path class="arrow" d="M1105 65H1185"/><rect class="box" x="1205" width="450" height="130" rx="18"/><text x="1230" y="45" class="title">PostgreSQL · geo_data</text><text x="1230" y="82" class="endpoint">place / place_source</text><text x="1230" y="110" class="note">실제 적재된 20,810개 장소</text></g>
<g transform="translate(0 580)"><rect class="screen" x="65" width="370" height="130" rx="18"/><text x="90" y="47" class="title">지도 표시 / 지역 확대</text><text x="90" y="83" class="note">브라우저에서 Google SDK 로드</text><path class="arrow" d="M445 65H525"/><rect class="box" x="545" width="550" height="130" rx="18"/><text x="570" y="45" class="title">Maps JavaScript API</text><text x="570" y="82" class="endpoint">VITE_GOOGLE_MAPS_API_KEY</text><text x="570" y="110" class="note">이 경로는 Express를 통하지 않습니다</text><path class="arrow" d="M1105 65H1185"/><rect class="box" x="1205" width="450" height="130" rx="18"/><text x="1230" y="45" class="title">Google 지도 + DB 좌표</text><text x="1230" y="82" class="note">마커 · panTo · zoom · polyline</text><text x="1230" y="110" class="note">실제 Chrome 지도 표시 검증 완료</text></g>
<g transform="translate(0 760)"><rect class="screen" x="65" width="370" height="140" rx="18"/><text x="90" y="47" class="title">여행 / 날짜별 일정</text><text x="90" y="83" class="note">추가 · 순서 변경 · 삭제 · 저장</text><path class="arrow" d="M445 70H525"/><rect class="box" x="545" width="550" height="140" rx="18"/><text x="570" y="35" class="endpoint">GET · POST /api/trips</text><text x="570" y="65" class="endpoint">GET · PATCH · DELETE /trips/:id</text><text x="570" y="95" class="endpoint">POST /trips/:id/days</text><text x="570" y="125" class="endpoint">PUT /trips/:id/days/:date/items</text><path class="arrow" d="M1105 70H1185"/><rect class="box" x="1205" width="450" height="140" rx="18"/><text x="1230" y="40" class="title">PostgreSQL · planner</text><text x="1230" y="75" class="endpoint">trip / trip_day / itinerary_item</text><text x="1230" y="110" class="note">소유자 검사 · 트랜잭션으로 저장</text></g>
<g transform="translate(0 950)"><rect class="screen" x="65" width="370" height="130" rx="18"/><text x="90" y="47" class="title">장소 사이 이동 구간</text><text x="90" y="83" class="note">순서 변경 시 인접 구간 재계산</text><path class="arrow" d="M445 65H525"/><rect class="box" x="545" width="550" height="130" rx="18"/><text x="570" y="40" class="endpoint">GET /api/trips/:id/days/</text><text x="570" y="71" class="endpoint">    :date/routes · route-options</text><text x="570" y="106" class="note">인증 + 소유자 검사 → 저장된 좌표 조회</text><path class="arrow" d="M1105 65H1185"/><rect class="box" x="1205" width="450" height="130" rx="18"/><text x="1230" y="40" class="title">Valhalla / Google Routes</text><text x="1230" y="75" class="note">차·도보·자전거: OSM / 대중교통: Google</text><text x="1230" y="110" class="note warn">교통비는 route-options에서 선택 조회</text></g>
<g transform="translate(0 1130)"><rect class="screen" x="65" width="370" height="130" rx="18"/><text x="90" y="47" class="title">해당 날짜의 날씨</text><text x="90" y="83" class="note">그날 첫 장소의 위치 기준</text><path class="arrow" d="M445 65H525"/><rect class="box" x="545" width="550" height="130" rx="18"/><text x="570" y="40" class="endpoint">GET /api/weather</text><text x="570" y="71" class="endpoint">?latitude=&amp;longitude=&amp;date=</text><text x="570" y="106" class="note">예보 범위 확인 → 오늘부터 10일 이내</text><path class="arrow" d="M1105 65H1185"/><rect class="box" x="1205" width="450" height="130" rx="18"/><text x="1230" y="40" class="title">Open-Meteo Forecast API</text><text x="1230" y="75" class="note">날씨 설명 · 최고/최저 기온 반환</text><text x="1230" y="110" class="note warn">일본 예보 정상 · 무료 개발용 / 출처 표시</text></g>
<text x="65" y="1340" class="note">일정 경로의 /trips 앞에는 모두 /api가 붙습니다. 각 행은 독립적인 요청 흐름이며 화살표는 서로 교차하지 않습니다.</text><text x="65" y="1375" class="note">2026-09-08 · 핵심 화면 흐름. 신규 메모·리뷰 등 전체 21개 경로: openapi-rest.json</text>
</svg>
