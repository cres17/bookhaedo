<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="764" viewBox="0 0 1120 764" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">기술 구성과 담당 기능</title><desc id="desc">화면과 지도: Vue · Router · TypeScript, 로그인 · 여행 · 날짜별 플래너, 동행자 변경 폴링; Google Maps · Places, 장소 마커 · 사진 · 리뷰, 경로 polyline 표시; Routes · Valhalla, 대중교통 / 도보·차량·자전거, 이동 수단별 경로 조회; Open-Meteo, 날짜별 예보 · 좌표별 캐시, 실내 대안 판단. API와 추천: Express · Zod, 라우팅 · 입력과 응답 검증, 출처 · 권한 · 요청 제한; scrypt · 세션 쿠키, 비밀번호 · 토큰 해시, 여행 소유자·동행자 확인; LangGraph.js, 검색 → 생성 → 검증, 규칙 기반 코스 생성; 일정 확정, revision · 장소 순서 검사, 충돌 시 저장 거절. 저장과 운영: PostgreSQL · PostGIS, 장소 · 여행 · 관광 근거, 공간 검색 · 트랜잭션; Python · SQL, OSM 적재 · 관광 자료 정제, snapshot 발행·철회; Prometheus · OpenAPI, 응답 시간 · 캐시 지표, API 명세 · DBML 검사; Vitest · Playwright, API·브라우저 검증, GitHub Actions · 백업 훈련</desc><rect width="1120" height="764" rx="12" fill="#FFFFFF"/><path d="M12 0 H1108 Q1120 0 1120 12 V64 H0 V12 Q0 0 12 0 Z" fill="#435A91"/><text x="560" text-anchor="middle" y="40" font-size="24" font-weight="600" fill="#FFFFFF">기술 구성과 담당 기능</text><rect x="28" y="84" width="332" height="654" rx="12" fill="#F0F0F7" fill-opacity="0.5" stroke="#DCDDE9"/><circle cx="50" cy="113" r="4" fill="#515477"/><text x="64" y="119" font-size="18" font-weight="600" fill="#30314F">화면과 지도</text><g><rect x="42" y="140" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M58 158 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="70" y="173" font-size="17" font-weight="600" fill="#30314F">Vue · Router · TypeScript</text><text x="58" y="208" font-size="16" fill="#53616C">로그인 · 여행 · 날짜별 플래너</text><text x="58" y="234" font-size="16" fill="#53616C">동행자 변경 폴링</text></g><g><rect x="42" y="286" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M58 304 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="70" y="319" font-size="17" font-weight="600" fill="#30314F">Google Maps · Places</text><text x="58" y="354" font-size="16" fill="#53616C">장소 마커 · 사진 · 리뷰</text><text x="58" y="380" font-size="16" fill="#53616C">경로 polyline 표시</text></g><g><rect x="42" y="432" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M58 450 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="70" y="465" font-size="17" font-weight="600" fill="#30314F">Routes · Valhalla</text><text x="58" y="500" font-size="16" fill="#53616C">대중교통 / 도보·차량·자전거</text><text x="58" y="526" font-size="16" fill="#53616C">이동 수단별 경로 조회</text></g><g><rect x="42" y="578" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M58 596 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="70" y="611" font-size="17" font-weight="600" fill="#30314F">Open-Meteo</text><text x="58" y="646" font-size="16" fill="#53616C">날짜별 예보 · 좌표별 캐시</text><text x="58" y="672" font-size="16" fill="#53616C">실내 대안 판단</text></g><rect x="394" y="84" width="332" height="654" rx="12" fill="#F0F0F7" fill-opacity="0.5" stroke="#DCDDE9"/><circle cx="416" cy="113" r="4" fill="#515477"/><text x="430" y="119" font-size="18" font-weight="600" fill="#30314F">API와 추천</text><g><rect x="408" y="140" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M424 158 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="436" y="173" font-size="17" font-weight="600" fill="#30314F">Express · Zod</text><text x="424" y="208" font-size="16" fill="#53616C">라우팅 · 입력과 응답 검증</text><text x="424" y="234" font-size="16" fill="#53616C">출처 · 권한 · 요청 제한</text></g><g><rect x="408" y="286" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M424 304 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="436" y="319" font-size="17" font-weight="600" fill="#30314F">scrypt · 세션 쿠키</text><text x="424" y="354" font-size="16" fill="#53616C">비밀번호 · 토큰 해시</text><text x="424" y="380" font-size="16" fill="#53616C">여행 소유자·동행자 확인</text></g><g><rect x="408" y="432" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M424 450 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="436" y="465" font-size="17" font-weight="600" fill="#30314F">LangGraph.js</text><text x="424" y="500" font-size="16" fill="#53616C">검색 → 생성 → 검증</text><text x="424" y="526" font-size="16" fill="#53616C">규칙 기반 코스 생성</text></g><g><rect x="408" y="578" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M424 596 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="436" y="611" font-size="17" font-weight="600" fill="#30314F">일정 확정</text><text x="424" y="646" font-size="16" fill="#53616C">revision · 장소 순서 검사</text><text x="424" y="672" font-size="16" fill="#53616C">충돌 시 저장 거절</text></g><rect x="760" y="84" width="332" height="654" rx="12" fill="#F0F0F7" fill-opacity="0.5" stroke="#DCDDE9"/><circle cx="782" cy="113" r="4" fill="#515477"/><text x="796" y="119" font-size="18" font-weight="600" fill="#30314F">저장과 운영</text><g><rect x="774" y="140" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M790 158 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="802" y="173" font-size="17" font-weight="600" fill="#30314F">PostgreSQL · PostGIS</text><text x="790" y="208" font-size="16" fill="#53616C">장소 · 여행 · 관광 근거</text><text x="790" y="234" font-size="16" fill="#53616C">공간 검색 · 트랜잭션</text></g><g><rect x="774" y="286" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M790 304 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="802" y="319" font-size="17" font-weight="600" fill="#30314F">Python · SQL</text><text x="790" y="354" font-size="16" fill="#53616C">OSM 적재 · 관광 자료 정제</text><text x="790" y="380" font-size="16" fill="#53616C">snapshot 발행·철회</text></g><g><rect x="774" y="432" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M790 450 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="802" y="465" font-size="17" font-weight="600" fill="#30314F">Prometheus · OpenAPI</text><text x="790" y="500" font-size="16" fill="#53616C">응답 시간 · 캐시 지표</text><text x="790" y="526" font-size="16" fill="#53616C">API 명세 · DBML 검사</text></g><g><rect x="774" y="578" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><path d="M790 596 v18" stroke="#515477" stroke-width="3" stroke-linecap="round"/><text x="802" y="611" font-size="17" font-weight="600" fill="#30314F">Vitest · Playwright</text><text x="790" y="646" font-size="16" fill="#53616C">API·브라우저 검증</text><text x="790" y="672" font-size="16" fill="#53616C">GitHub Actions · 백업 훈련</text></g></svg>