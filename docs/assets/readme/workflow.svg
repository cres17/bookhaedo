<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="704" viewBox="0 0 1120 704" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">Book해도. · 코스 추천</title><desc id="desc">Book해도. · 코스 추천</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#30314F" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1120" height="704" rx="12" fill="#FAFAFD" stroke="#DCDDE9"/><path d="M12 0 H1108 Q1120 0 1120 12 V64 H0 V12 Q0 0 12 0 Z" fill="#30314F"/><text x="560" text-anchor="middle" y="42" font-size="25" fill="#FFFFFF" font-weight="600">Book해도. · 코스 추천</text><g transform="translate(0 -80)"><text x="40" y="184" font-size="16" fill="#20252B" font-weight="600">후보 수집</text><rect x="40" y="202" width="328" height="120" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><text x="60" y="236" font-size="22" fill="#20252B" font-weight="600">여행 조건 해석</text><text x="60" y="266" font-size="16" fill="#20252B" font-weight="500">날짜 · 지역 · 유지할 장소</text><path d="M373 262 L390 262" fill="none" stroke="#515477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="396" y="202" width="328" height="120" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><text x="416" y="236" font-size="22" fill="#20252B" font-weight="600">관광 자료 검색</text><text x="416" y="266" font-size="16" fill="#20252B" font-weight="500">10 → 15 → 20km</text><path d="M729 262 L746 262" fill="none" stroke="#515477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="752" y="202" width="328" height="120" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><text x="772" y="236" font-size="22" fill="#20252B" font-weight="600">첫 검색에서 예보 조회</text><text x="772" y="266" font-size="16" fill="#20252B" font-weight="500">Open-Meteo</text><text x="40" y="364" font-size="16" fill="#20252B" font-weig