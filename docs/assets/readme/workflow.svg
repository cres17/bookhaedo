"  marker-end="url(#arrow)"/><rect x="752" y="562" width="328" height="120" rx="8" fill="#FFFFFF" stroke="#DCDDE9"/><text x="772" y="596" font-size="22" fill="#20252B" font-weight="600">일정에 저장</text><text x="772" y="626" font-size="16" fill="#20252B" font-weight="500">현재 버전이 맞을 때만 반영</text><text x="40" y="761" font-size="13" fill="#20252B" font-weight="500">재검색에서는 예보를 다시 조회하지 않습니다. 외부 LLM 없이 실행되는 그래프입니다.</text></g></svg>