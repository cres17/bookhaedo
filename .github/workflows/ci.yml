name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: bookhaedo_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: bookhaedo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bookhaedo_test -d bookhaedo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bookhaedo_test:ci_test_only@127.0.0.1:5432/bookhaedo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run db:init
      - run: npm run test:ci
      - run: npm run spec:check
      - run: npm run build
