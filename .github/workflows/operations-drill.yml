name: operations-drill
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 1'
permissions:
  contents: read
jobs:
  recovery-and-load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: bookhaedo_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: bookhaedo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bookhaedo_test -d bookhaedo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bookhaedo_test:ci_test_only@127.0.0.1:5432/bookhaedo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install matching PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - run: npm ci
      - run: npm run db:init
      - run: npm run db:backup -- --output /tmp/bookhaedo-ci.dump
      - run: npm run db:restore:drill -- --archive /tmp/bookhaedo-ci.dump
      - run: npm run test:load:ci
