services:
  db:
    image: postgis/postgis:17-3.5
    # The upstream PostGIS image is amd64-only for this tag. Docker Desktop
    # emulates it on Apple Silicon; AWS/Linux amd64 runs it natively.
    platform: linux/amd64
    environment:
      POSTGRES_DB: kita_plan
      POSTGRES_USER: kita_plan
      POSTGRES_PASSWORD: kita_plan_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kita_plan -d kita_plan"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - kita_plan_postgres:/var/lib/postgresql/data

volumes:
  kita_plan_postgres:
